### Run only after registering gemma_customer_support in data/dataset_info.json.
### Validate all keys against the installed LLaMA-Factory revision.

model_name_or_path: google/gemma-3-1b-it

stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_target: all

dataset: gemma_customer_support
template: gemma3
cutoff_len: 256
max_samples: 100
overwrite_cache: true
preprocessing_num_workers: 4
dataloader_num_workers: 2

output_dir: saves/gemma3-1b/lora/smoke
logging_steps: 1
save_strategy: steps
save_steps: 10
save_total_limit: 2
plot_loss: true
overwrite_output_dir: false
report_to: none

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.0001
max_steps: 20
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
seed: 42

val_size: 0.2
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 10

